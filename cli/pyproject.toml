[project]
name = "fit"
version = "0.1.0"
description = "Helper for managing FIT boards"
readme = "../README.md"
authors = [
    { name = "Hot.Fish", email = "admin@hot.fish" }
]
requires-python = ">=3.14"
dependencies = [
    "rapidfuzz>=3.14.6",
    "typer>=0.28.0",
]

[project.scripts]
fit = "fit:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
